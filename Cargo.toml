[package]
name = "pincers"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
eframe = "0.37.0"
egui_extras = { version = "0.37", features = ["svg"] }
futures-util = "0.3.34"
indicatif = "0.18.6"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "gzip", "http2"] }
resvg = { version = "0.45.1", default-features = false }
rfd = "0.17.2"
roxmltree = "0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
url = "2.5.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Globalization", "Win32_System_Registry"] }

[build-dependencies]
resvg = "0.45.1"
winresource = "0.1.34"
